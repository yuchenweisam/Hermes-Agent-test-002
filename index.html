<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tasks</title>
<style>
  /* ── Design tokens ─────────────────────────────────────────────── */
  :root {
    --bg:        oklch(98.4% 0.004 85);
    --surface:   oklch(100% 0 0);
    --surface-2: oklch(97% 0.004 85);
    --ink:       oklch(24% 0.014 60);
    --ink-muted: oklch(53% 0.012 60);
    --ink-faint: oklch(68% 0.01 65);
    --border:    oklch(90% 0.006 80);
    --border-2:  oklch(84% 0.008 75);
    --accent:    oklch(52% 0.135 38);
    --accent-ink:oklch(100% 0 0);
    --accent-bg: oklch(96% 0.022 45);
    --done:      oklch(52% 0.088 155);
    --danger:    oklch(52% 0.17 25);
    --ring:      oklch(62% 0.12 45 / 0.45);

    --font-display: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;

    --shadow-1: 0 1px 2px oklch(24% 0.02 60 / 0.06), 0 1px 1px oklch(24% 0.02 60 / 0.04);
    --shadow-2: 0 6px 20px oklch(24% 0.02 60 / 0.08), 0 2px 6px oklch(24% 0.02 60 / 0.05);

    --tap: 44px;
    --ease: cubic-bezier(.2, .8, .3, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        oklch(19.5% 0.008 70);
      --surface:   oklch(23.5% 0.009 70);
      --surface-2: oklch(27% 0.01 70);
      --ink:       oklch(94% 0.004 80);
      --ink-muted: oklch(72% 0.01 75);
      --ink-faint: oklch(56% 0.011 72);
      --border:    oklch(31% 0.009 70);
      --border-2:  oklch(38% 0.011 70);
      --accent:    oklch(70% 0.115 45);
      --accent-ink:oklch(18% 0.02 50);
      --accent-bg: oklch(28% 0.03 45);
      --done:      oklch(70% 0.08 155);
      --danger:    oklch(68% 0.15 28);
      --ring:      oklch(70% 0.11 45 / 0.5);
      --shadow-1: 0 1px 2px oklch(0% 0 0 / 0.3);
      --shadow-2: 0 6px 20px oklch(0% 0 0 / 0.35);
    }
  }

  /* ── Base ──────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 5vw, 56px) clamp(14px, 4vw, 28px);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ── App shell ─────────────────────────────────────────────────── */
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-self: flex-start;
  }

  /* ── Masthead ──────────────────────────────────────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .title {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 600;
    letter-spacing: -0.015em;
    text-wrap: pretty;
  }

  .counter {
    font-family: var(--font-mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .counter b { color: var(--ink); font-weight: 600; }

  /* ── Add form ──────────────────────────────────────────────────── */
  .composer {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }

  .composer input {
    min-height: var(--tap);
    padding: 0 14px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-1);
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .composer input::placeholder { color: var(--ink-faint); }
  .composer input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ring);
  }

  .btn-add {
    min-height: var(--tap);
    min-width: var(--tap);
    padding: 0 18px;
    font: inherit;
    font-weight: 550;
    color: var(--accent-ink);
    background: var(--accent);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    cursor: pointer;
    box-shadow: var(--shadow-1);
    transition: transform .12s var(--ease), filter .15s var(--ease);
  }
  .btn-add:hover { filter: brightness(1.06); }
  .btn-add:active { transform: translateY(1px); }

  /* ── Toolbar / filters ─────────────────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filters {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
  }

  .filter {
    min-height: 36px;
    padding: 0 14px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-muted);
    background: transparent;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s var(--ease), color .15s var(--ease);
  }
  .filter:hover { color: var(--ink); }
  .filter[aria-selected="true"] {
    color: var(--ink);
    background: var(--surface);
    box-shadow: var(--shadow-1);
  }

  .spacer { flex: 1 1 auto; }

  .btn-ghost {
    min-height: 36px;
    padding: 0 12px;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: color .15s var(--ease), background .15s var(--ease);
  }
  .btn-ghost:hover { color: var(--danger); background: var(--surface-2); }
  .btn-ghost[hidden] { display: none; }

  /* ── List ──────────────────────────────────────────────────────── */
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: start;
    gap: 12px;
    padding: 10px 10px 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-1);
    animation: item-in .22s var(--ease) both;
  }
  .item.removing { animation: item-out .16s var(--ease) both; }

  @keyframes item-in  { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes item-out { to   { opacity: 0; transform: translateX(6px) scale(.99); } }

  /* Custom checkbox: real input kept for semantics + a11y */
  .check {
    position: relative;
    width: var(--tap);
    height: var(--tap);
    margin: -8px 0 -8px -8px;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
  }
  .check input {
    position: absolute;
    inset: 0;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .box {
    width: 21px; height: 21px;
    border: 1.5px solid var(--border-2);
    border-radius: 50%;
    background: var(--surface);
    display: grid;
    place-items: center;
    transition: border-color .15s var(--ease), background .15s var(--ease);
  }
  .check:hover .box { border-color: var(--accent); }
  .check input:focus-visible + .box {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  .box svg { width: 12px; height: 12px; display: block; }
  .box path {
    fill: none;
    stroke: var(--accent-ink);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 20;
    stroke-dashoffset: 20;
    transition: stroke-dashoffset .22s var(--ease) .04s;
  }
  .item.is-done .box { background: var(--done); border-color: var(--done); }
  .item.is-done .box path { stroke-dashoffset: 0; }

  .label {
    padding: 10px 0;
    font-size: 15.5px;
    line-height: 1.45;
    overflow-wrap: anywhere;
    transition: color .2s var(--ease);
  }
  .item.is-done .label {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
    text-decoration-thickness: 1px;
  }

  .btn-del {
    width: 32px; height: 32px;
    margin: 4px 0 0;
    display: grid;
    place-items: center;
    font-size: 18px;
    line-height: 1;
    color: var(--ink-faint);
    background: transparent;
    border: 0;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: color .15s var(--ease), background .15s var(--ease);
  }
  .btn-del:hover { color: var(--danger); background: var(--surface-2); }
  .item.is-done .btn-del { color: var(--ink-faint); }

  /* ── Empty state ───────────────────────────────────────────────── */
  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--ink-muted);
    border: 1px dashed var(--border-2);
    border-radius: var(--r-lg);
  }
  .empty p { margin: 0; font-size: 15px; }
  .empty .hint { margin-top: 6px; font-size: 13.5px; color: var(--ink-faint); }

  /* ── Footer ────────────────────────────────────────────────────── */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-top: 4px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }
  kbd {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  /* ── Motion preference ─────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }

  @media (max-width: 420px) {
    .composer { grid-template-columns: 1fr; }
    .btn-add { width: 100%; }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <h1 class="title">Tasks</h1>
      <p class="counter" id="counter" aria-live="polite" aria-atomic="true"></p>
    </header>

    <form class="composer" id="form" autocomplete="off">
      <label class="visually-hidden" for="input">New task</label>
      <input id="input" name="task" type="text" placeholder="What needs doing?" maxlength="500" enterkeyhint="done">
      <button class="btn-add" type="submit">Add</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="tablist" aria-label="Filter tasks">
        <button class="filter" role="tab" data-filter="all"    aria-selected="true">All</button>
        <button class="filter" role="tab" data-filter="active" aria-selected="false">Active</button>
        <button class="filter" role="tab" data-filter="done"   aria-selected="false">Done</button>
      </div>
      <span class="spacer"></span>
      <button class="btn-ghost" id="clear" type="button" hidden>Clear done</button>
    </div>

    <ul class="list" id="list"></ul>

    <p class="foot">
      <span>Saved locally in this browser</span>
      <span><kbd>Enter</kbd> to add · <kbd>Esc</kbd> to clear</span>
    </p>
  </main>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'hermes.tasks.v1';

  const els = {
    form:    document.getElementById('form'),
    input:   document.getElementById('input'),
    list:    document.getElementById('list'),
    counter: document.getElementById('counter'),
    clear:   document.getElementById('clear'),
    filters: Array.from(document.querySelectorAll('.filter')),
  };

  /** @type {{id:string, text:string, done:boolean, createdAt:number}[]} */
  let tasks = [];
  let filter = 'all';

  /* ── Persistence ─────────────────────────────────────────────── */

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.tasks)) return;
      // Defensive normalisation: never trust stored shape.
      tasks = parsed.tasks
        .filter(t => t && typeof t.text === 'string')
        .map(t => ({
          id: typeof t.id === 'string' && t.id ? t.id : uid(),
          text: t.text,
          done: Boolean(t.done),
          createdAt: Number.isFinite(t.createdAt) ? t.createdAt : Date.now(),
        }));
      if (['all', 'active', 'done'].includes(parsed.filter)) filter = parsed.filter;
    } catch (err) {
      console.warn('Could not read saved tasks; starting fresh.', err);
      tasks = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks, filter }));
    } catch (err) {
      // Quota or private-mode failure: the app keeps working in memory.
      console.warn('Could not save tasks.', err);
    }
  }

  const uid = () =>
    Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  /* ── Mutations ───────────────────────────────────────────────── */

  function addTask(text) {
    tasks.push({ id: uid(), text, done: false, createdAt: Date.now() });
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) t.done = !t.done;
  }

  function removeTask(id) {
    tasks = tasks.filter(t => t.id !== id);
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
  }

  /* ── Rendering ───────────────────────────────────────────────── */

  const visible = () =>
    filter === 'active' ? tasks.filter(t => !t.done)
  : filter === 'done'   ? tasks.filter(t => t.done)
  : tasks;

  function makeItem(task) {
    const li = document.createElement('li');
    li.className = 'item' + (task.done ? ' is-done' : '');
    li.dataset.id = task.id;

    // Checkbox (native input for semantics, custom-painted)
    const check = document.createElement('label');
    check.className = 'check';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = task.done;
    input.setAttribute('aria-label',
      (task.done ? 'Mark as not done: ' : 'Mark as done: ') + task.text);
    input.addEventListener('change', () => {
      toggleTask(task.id);
      save();
      render();
    });
    const box = document.createElement('span');
    box.className = 'box';
    box.setAttribute('aria-hidden', 'true');
    box.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-6.5"/></svg>';
    check.append(input, box);

    // Text — textContent only, never innerHTML, so task text can't inject markup
    const span = document.createElement('span');
    span.className = 'label';
    span.textContent = task.text;

    // Delete
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn-del';
    del.setAttribute('aria-label', 'Delete: ' + task.text);
    del.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
    del.addEventListener('click', () => {
      const li2 = del.closest('.item');
      const finish = () => { removeTask(task.id); save(); render(); };
      if (li2 && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        li2.classList.add('removing');
        li2.addEventListener('animationend', finish, { once: true });
        setTimeout(finish, 250); // fallback if animationend never fires
      } else {
        finish();
      }
    });

    li.append(check, span, del);
    return li;
  }

  function render() {
    const rows = visible();

    els.list.replaceChildren(...rows.map(makeItem));

    // Empty state
    if (rows.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      const msg = tasks.length === 0
        ? 'Nothing here yet.'
        : filter === 'active'
          ? 'No active tasks — all clear.'
          : 'No completed tasks yet.';
      const hint = tasks.length === 0
        ? 'Add your first task above.'
        : 'Switch filters to see the rest.';
      const p = document.createElement('p');
      p.textContent = msg;
      const h = document.createElement('p');
      h.className = 'hint';
      h.textContent = hint;
      empty.append(p, h);
      els.list.append(empty);
    }

    // Counts
    const active = tasks.filter(t => !t.done).length;
    const done = tasks.length - active;
    els.counter.replaceChildren();
    const b = document.createElement('b');
    b.textContent = String(active);
    els.counter.append(b, document.createTextNode(
      active === 1 ? ' to do' : ' to do' + (done ? ' · ' + done + ' done' : '')
    ));
    if (active === 0 && done === 0) els.counter.textContent = 'No tasks';

    // Clear-done affordance only when it can act
    els.clear.hidden = done === 0;

    // Filter state
    for (const f of els.filters) {
      f.setAttribute('aria-selected', String(f.dataset.filter === filter));
    }
  }

  /* ── Events ──────────────────────────────────────────────────── */

  els.form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = els.input.value.trim();
    if (!text) { els.input.focus(); return; }
    addTask(text);
    els.input.value = '';
    save();
    render();
    els.input.focus();
  });

  els.input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { els.input.value = ''; }
  });

  for (const f of els.filters) {
    f.addEventListener('click', () => {
      filter = f.dataset.filter;
      save();
      render();
    });
  }

  els.clear.addEventListener('click', () => {
    clearDone();
    save();
    render();
  });

  // Keep tabs in sync if the same list is open in another tab.
  window.addEventListener('storage', (e) => {
    if (e.key !== STORAGE_KEY) return;
    load();
    render();
  });

  /* ── Boot ────────────────────────────────────────────────────── */
  load();
  render();
  els.input.focus();
})();
</script>
</body>
</html>
